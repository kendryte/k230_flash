name: CLI build and release

on:
  push:
    tags: ["v*"]
    branches: ["main", "dev"]

concurrency:
  group: k230-flash-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Get revision
        run: echo "K230_FLASH_REVISION=$(git describe --long --tags --always)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Build and package
        env:
          K230_FLASH_BUILD_DIR: ${{ github.workspace }}/build/release/linux
          K230_FLASH_DIST_DIR: ${{ github.workspace }}/dist
        run: ./release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: k230-flash-linux
          path: dist/*
          if-no-files-found: error

  build-windows:
    name: Windows x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Get revision
        run: echo "K230_FLASH_REVISION=$(git describe --long --tags --always)" >> "$GITHUB_ENV"

      - name: Build and package with LLVM-MinGW
        run: |
          mkdir -p "${{ github.workspace }}/build/windows" "${{ github.workspace }}/dist"
          docker run --rm \
            -e K230_FLASH_REVISION="${K230_FLASH_REVISION}" \
            -v "${{ github.workspace }}:/project:ro" \
            -v "${{ github.workspace }}/build/windows:/build" \
            -v "${{ github.workspace }}/dist:/output" \
            mstorsjo/llvm-mingw /bin/bash -euc '
              K230_FLASH_TARGET_OS=windows \
              K230_FLASH_TARGET_ARCH=x86_64 \
              K230_FLASH_BUILD_DIR=/build \
              K230_FLASH_DIST_DIR=/output \
              CMAKE_TOOLCHAIN_FILE=/project/src/cli/cmake/mingw-toolchain.cmake \
              BUILD_WITH_MINGW=ON \
              CMAKE_GENERATOR="Unix Makefiles" \
              /project/release.sh
            '

      - uses: actions/upload-artifact@v4
        with:
          name: k230-flash-windows
          path: dist/*
          if-no-files-found: error

  build-macos:
    name: macOS ARM64 validation/release
    runs-on: [self-hosted, macOS, ARM64, shenzhen_mac]
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/') && 'macos-signing' || 'macos-validation' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install dependencies
        run: brew install ninja

      - name: Verify installed signing identity
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_KEYCHAIN: ${{ secrets.MACOS_KEYCHAIN }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          : "${MACOS_SIGN_IDENTITY:?Set MACOS_SIGN_IDENTITY in the macos-signing environment}"
          : "${MACOS_KEYCHAIN_PASSWORD:?Set MACOS_KEYCHAIN_PASSWORD in the macos-signing environment}"
          MACOS_SIGN_IDENTITY="${MACOS_SIGN_IDENTITY//$'\r'/}"
          MACOS_SIGN_IDENTITY="${MACOS_SIGN_IDENTITY//$'\n'/}"
          MACOS_KEYCHAIN="${MACOS_KEYCHAIN//$'\r'/}"
          MACOS_KEYCHAIN="${MACOS_KEYCHAIN//$'\n'/}"
          if [[ -n "${MACOS_KEYCHAIN:-}" ]]; then
            signing_keychain="$MACOS_KEYCHAIN"
          else
            signing_keychain=$(security default-keychain -d user | sed 's/^"//; s/"$//')
          fi
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$signing_keychain" >/dev/null
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" "$signing_keychain" >/dev/null
          identities=$(security find-identity -v -p codesigning "$signing_keychain" 2>/dev/null)
          if ! grep -F -- "$MACOS_SIGN_IDENTITY" <<<"$identities" >/dev/null; then
            echo "Installed signing identity was not found: $MACOS_SIGN_IDENTITY" >&2
            exit 1
          fi

      - name: Build and sign release artifact
        env:
          K230_FLASH_BUILD_DIR: ${{ github.workspace }}/build/release/macos
          K230_FLASH_DIST_DIR: ${{ github.workspace }}/dist
          MACOS_ARCHITECTURES: arm64
          MACOS_SIGN_IDENTITY: ${{ startsWith(github.ref, 'refs/tags/') && secrets.MACOS_SIGN_IDENTITY || '' }}
          MACOS_KEYCHAIN: ${{ startsWith(github.ref, 'refs/tags/') && secrets.MACOS_KEYCHAIN || '' }}
          MACOS_NOTARY_PROFILE: ${{ startsWith(github.ref, 'refs/tags/') && secrets.MACOS_NOTARY_PROFILE || '' }}
          MACOS_ALLOW_UNSIGNED: ${{ startsWith(github.ref, 'refs/tags/') && '' || '1' }}
        run: ./release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: k230-flash-macos-arm64
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          find release -maxdepth 1 -type f -print
          test -n "$(find release -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print -quit)"
          test -n "$(find release -maxdepth 1 -type f -name '*.sha256' -print -quit)"
          if find release -mindepth 2 -type f -print -quit | grep -q .; then
            echo "Unexpected nested files in release download" >&2
            exit 1
          fi

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          files: |
            release/*.tar.gz
            release/*.zip
            release/*.sha256
